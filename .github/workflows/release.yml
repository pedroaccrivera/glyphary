name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com

      - run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ ! -f scripts/check-version.mjs ]; then
            echo "Skipping the check: this tag predates scripts/check-version.mjs."
            exit 0
          fi
          node scripts/check-version.mjs "$GITHUB_REF_NAME"

      - name: Verify
        run: |
          npm run lint
          npm run test:unit
          npm run build

      - name: Publish the standalone viewer as a release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/glyphary.html
          generate_release_notes: true

      # Private registries are opt-in: uncomment and set the scope in package.json
      # (e.g. "name": "@your-org/glyphary") plus a token with write access.
      # - name: Publish to the private registry
      #   if: startsWith(github.ref, 'refs/tags/')
      #   run: npm publish
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  desktop:
    # One native runner per target: macos-15 is arm64, macos-15-intel is x64,
    # windows-2022 is x64. Add a universal macOS build here if it is ever wanted.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build the installers
        run: npm run desktop:build -- --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish-desktop:
    needs: [release, desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: bundles
          merge-multiple: true

      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          find bundles -type f -print
          find bundles -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
