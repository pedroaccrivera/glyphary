name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint and formatting
        run: |
          npm run lint
          npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Build the standalone viewer
        run: npm run build

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome

      - name: Store the shareable artifact
        if: matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: glyphary
          path: dist/glyphary.html
          if-no-files-found: error

      - name: Store failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-node${{ matrix.node }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  desktop:
    # The full macOS/Windows matrix runs for tags in release.yml. Compiling the
    # app here catches Rust and packaging regressions on every push without
    # paying for three macOS/Windows VMs.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: aarch64-apple-darwin

      - run: npm ci

      - name: Compile the desktop app
        run: npm run desktop:build -- --target aarch64-apple-darwin --debug --no-bundle
