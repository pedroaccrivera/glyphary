[package]
name = "glyphary"
version = "0.2.1"
description = "Local icon font viewer"
authors = ["Pedro Rivera"]
license = "MIT"
repository = "https://github.com/pedroaccrivera/glyphary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
